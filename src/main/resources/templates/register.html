
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Campus Lost & Found</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f4f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 14px;
            width: 380px;
            max-width: 92%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #6737f5;
        }

        p { text-align: center; color: #666; }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #6737f5;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background: #5428d0; }

        .error {
            color: #c62828;
            background: #ffebee;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        a { color: #6737f5; }
    </style>
</head>

<body>
<div class="container">

    <h2>Campus Lost & Found</h2>
    <p>Create your account</p>

    <div th:if="${error}" class="error"
         th:text="${error}"></div>

    <form th:action="@{/register}" method="post">

        <label for="username">Username</label>
        <input type="text"
               id="username"
               name="username"
               minlength="3"
               required>

        <label for="password">Password</label>
        <input type="password"
               id="password"
               name="password"
               minlength="6"
               required>

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a th:href="@{/login}">Sign in</a>
    </p>

</div>
</body>
</html>
